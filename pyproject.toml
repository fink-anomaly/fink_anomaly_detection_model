[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fink_anomaly_detection_model"
version = "0.4.82"
description = "Fink SNAD Anomaly Detection Model"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { email = "timofei.psheno@gmail.com" }
]
dependencies = [
    "scikit-learn>=1.3.1",
    "numpy==1.26.4",
    "pandas>=2.1.1",
    "tqdm>=4.65.0",
    "scipy>=1.10.1",
    "onnx==1.16.1",
    "skl2onnx==1.17.0",
    "pyarrow>=13.0.0",
    "coniferest==0.1.1",
    "telethon",
    "slack_sdk",
    "config",
    "configparser",
    "fink_science==3.13.3",
    "Pillow",
    "pyspark==3.1.3",
    "light_curve",
    "psutil",
    "seaborn==0.13.2",
    "matplotlib==3.9.0",
    "optuna",
    "requests",
]

[project.scripts]
fink_ad_model_train = "fink_anomaly_detection_model:fink_ad_model_train"
get_anomaly_reactions = "fink_anomaly_detection_model:get_reactions"
data_transform = "fink_anomaly_detection_model:data_transform"

[tool.setuptools.packages.find]
where = ["."]